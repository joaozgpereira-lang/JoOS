# JoOS Mako — notifications (rendered by joos-theme)
font=Noto Sans Mono 10
width=360
height=120
padding=10
margin=12
border-size=2
border-radius=0
background-color=@bg@
text-color=@fg@
border-color=@accent@
progress-color=over @accent@

[urgency=low]
text-color=@fg_dim@

[urgency=critical]
background-color=@urgent@
text-color=@bg@
border-color=@urgent@