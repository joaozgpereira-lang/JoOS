# JoOS hyprlock — pixelated lock screen (rendered by joos-theme)

background {
    monitor =
    path = $HOME/.config/joos/wallpaper.bin
    color = @hypr_bg@
    blur_size = 0
    brightness = 1.0
}

input-field {
    monitor =
    size = 400, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.6
    dots_center = true
    outer_color = @hypr_accent@
    inner_color = @hypr_bg_alt@
    font_color = @hypr_fg@
    fade_on_empty = true
    placeholder_text = <i>Desbloquear...</i>
    hide_input = false
    position = 0, -160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date "+%H:%M"
    color = @hypr_fg@
    font_size = 42
    font_family = "monospace"
    outline_thickness = 4
    outline_color = @hypr_bg@
    shadow_passes = 0
    position = 0, -280
    halign = center
    valign = center
}

label {
    monitor =
    text = JoOS
    color = @hypr_accent@
    font_size = 16
    font_family = "monospace"
    position = 0, -340
    halign = center
    valign = center
}