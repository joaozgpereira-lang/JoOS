# JoOS — Hyprland configuration
# Keyboard-first: the Super (Windows) key drives everything.
# Window tiling: dwindle layout (windows split automatically), like Omarchy.
# Workspaces: 1..9, each bound to Super+1..9.

####################################################################
# SOURCE COLOR PALETTE (regenerated by `joos-theme set <theme>`)
####################################################################
source = ~/.config/hypr/colors.conf

####################################################################
# MONITOR
####################################################################
monitor = ,preferred,auto,1

####################################################################
# AUTOSTART (waybar, wallpaper, notifications, clipboard, polkit)
####################################################################
exec-once = waybar
exec-once = joos-wallpaper apply
exec-once = mako
exec-once = hypridle
exec-once = cliphist wipe && wl-paste --type text --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

####################################################################
# INPUT
####################################################################
input {
    kb_layout = br,us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

####################################################################
# GENERAL — pixel aesthetic: thin borders, crisp corners, gaps
####################################################################
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    active_border = $active_border
    inactive_border = $inactive_border
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }
}

animation {
    enabled = true
    bezier = smooth, 0.2, 0.8, 0.2, 1
    animation = windows, 1, 4, smooth
    animation = borders, 1, 4, smooth
    animation = workspace, 1, 4, smooth, popin 90%
}

####################################################################
# DWINDLE — windows auto-split to fill the screen (Omarchy tiling)
####################################################################
dwindle {
    pseudotile = false
    force_split = 2
    preserve_split = true
    smart_split = false
}

####################################################################
# WORKSPACES
####################################################################
workspace = 1, default
workspace = 2, default
workspace = 3, default
workspace = 4, default
workspace = 5, default
workspace = 6, default
workspace = 7, default
workspace = 8, default
workspace = 9, default

# windows never overlap floating ones accidentally
windowrulev2 = tile, class:.*

####################################################################
# KEYBINDINGS — Super-first, mirrored from Omarchy
####################################################################
$mod = SUPER

# ---- Launch ----------------------------------------------------------------
bind = $mod, Return, exec, alacritty                                   # terminal
bind = $mod SHIFT, Return, exec, firefox                               # browser
bind = $mod, Space, exec, rofi -show drun -theme joos                  # app menu
bind = $mod ALT, Space, exec, joos-menu                                # control menu
bind = $mod SHIFT, V, exec, joos-picker clipboard                      # clipboard history
bind = $mod, P, exec, joos-screenshot region                           # screenshot region
bind = $mod CTRL, P, exec, joos-screenshot full                        # screenshot full
bind = $mod, K, exec, joos-keys                                        # keybinding reference
bind = $mod, Escape, exec, joos-power                                  # system/power menu
bind = $mod CTRL, L, exec, hyprlock                                    # lock screen
bind = $mod CTRL, Space, exec, joos-wallpaper next                     # cycle wallpaper
bind = $mod CTRL SHIFT, Space, exec, joos-theme cycle                  # cycle theme

# ---- Window management ------------------------------------------------------
bind = $mod, W, killactive                                             # close window
bind = $mod, F, fullscreen 1                                           # fullscreen
bind = $mod, T, togglefloating,                                        # tile <-> float
bind = $mod SHIFT, T, togglefloating                                   # alt float toggle
bind = $mod, J, togglesplit                                            # flip split direction
bind = $mod, M, fullscreen 0                                           # fullscreen (fill)
bind = $mod, V, togglefloating                                         # quick float
bind = $mod, C, centerwindow                                          # center floating window

# ---- Layout ----------------------------------------------------------------
bind = $mod, L, exec, joos-layout-toggle                               # dwindle <-> master

# ---- Focus & movement ------------------------------------------------------
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# ---- Resize (hover to edge then Super+arrows, or use these) ----------------
bind = $mod, bracketleft, resizeactive, -30 0
bind = $mod, bracketright, resizeactive, 30 0
bind = $mod, comma, resizeactive, 0 -30
bind = $mod, period, resizeactive, 0 30

# ---- Workspaces -------------------------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod CTRL, right, workspace, +1
bind = $mod CTRL, left, workspace, -1
bind = $mod SHIFT, right, workspace, +100                      # next monitor
bind = $mod SHIFT, left, workspace, -100                       # prev monitor

# ---- System -----------------------------------------------------------------
bind = $mod CTRL, Escape, exit                                  # quit session
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , Print, exec, joos-screenshot region

# ---- Mouse ------------------------------------------------------------------
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

####################################################################
# WINDOW RULES
####################################################################
windowrulev2 = float, class:(pavucontrol)
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = opacity 1.0 override 1.0 override, class:(firefox)